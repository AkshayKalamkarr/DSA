<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Midnight Run — Bike Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#05060a;
    --asphalt:#0b0e14;
    --asphalt-2:#12161f;
    --cyan:#00f0ff;
    --cyan-dim:#0a8a99;
    --magenta:#ff2e88;
    --amber:#ffb020;
    --danger:#ff3b3b;
    --ink:#e8ecf1;
    --ink-dim:#8b93a7;
    --lane:#f4d35e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-void);
    color:var(--ink);
    font-family:'Rajdhani',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 0%, #131a26 0%, var(--bg-void) 60%);
  }

  #stage{
    position:relative;
    width:min(94vw, 480px);
    aspect-ratio: 9 / 15.5;
    max-height:96vh;
    border-radius:14px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(0,240,255,0.15),
      0 0 40px rgba(0,240,255,0.08),
      0 30px 60px -20px rgba(0,0,0,0.8);
    background:var(--asphalt);
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:12px 14px 0;
    pointer-events:none;
    z-index:5;
  }
  .hud-block{
    display:flex; flex-direction:column; gap:1px;
  }
  .hud-label{
    font-size:9px; letter-spacing:2.5px; color:var(--ink-dim);
    text-transform:uppercase; font-weight:600;
  }
  .hud-value{
    font-family:'Orbitron',sans-serif; font-weight:700;
    font-size:20px; color:var(--cyan);
    text-shadow:0 0 10px rgba(0,240,255,0.6);
    font-variant-numeric: tabular-nums;
  }
  #hud .right .hud-value{ color:var(--amber); text-shadow:0 0 10px rgba(255,176,32,0.55); text-align:right;}
  #hud .right{ align-items:flex-end; }

  #boostWrap{
    position:absolute; top:56px; left:14px; right:14px;
    height:5px; border-radius:3px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    z-index:5;
    pointer-events:none;
  }
  #boostBar{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--cyan-dim), var(--magenta));
    box-shadow:0 0 8px var(--magenta);
    transition:width 0.08s linear;
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(0,240,255,0.08), transparent 60%),
      rgba(5,6,10,0.92);
    z-index:10;
    padding:24px;
    gap:6px;
  }
  .hidden{ display:none !important; }

  .eyebrow{
    font-size:11px; letter-spacing:5px; color:var(--magenta);
    text-transform:uppercase; font-weight:700; margin-bottom:6px;
  }
  .title{
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:clamp(28px, 8vw, 40px);
    letter-spacing:2px;
    color:var(--ink);
    text-shadow:
      0 0 12px rgba(0,240,255,0.85),
      0 0 32px rgba(255,46,136,0.35);
    margin:0 0 4px;
    line-height:1.05;
  }
  .subtitle{
    color:var(--ink-dim); font-size:14px; font-weight:500;
    max-width:280px; line-height:1.5; margin-bottom:18px;
  }
  .subtitle b{ color:var(--ink); font-weight:700;}

  .btn{
    font-family:'Orbitron',sans-serif; font-weight:700;
    font-size:14px; letter-spacing:2px; text-transform:uppercase;
    color:var(--bg-void);
    background:linear-gradient(180deg, var(--cyan), var(--cyan-dim));
    border:none; border-radius:8px;
    padding:14px 34px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,240,255,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:active{ transform:scale(0.96); box-shadow:0 0 10px rgba(0,240,255,0.4);}

  .stats-row{
    display:flex; gap:22px; margin:18px 0 22px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:2px;}
  .stat .n{ font-family:'Orbitron',sans-serif; font-weight:700; font-size:22px; color:var(--amber); text-shadow:0 0 10px rgba(255,176,32,0.5);}
  .stat .l{ font-size:10px; letter-spacing:2px; color:var(--ink-dim); text-transform:uppercase;}

  .hint{
    position:absolute; bottom:14px; left:0; right:0;
    text-align:center; font-size:11px; color:var(--ink-dim);
    letter-spacing:1px;
  }
  .hint b{ color:var(--cyan); }

  .newbest{
    color:var(--magenta); font-family:'Orbitron',sans-serif; font-weight:700;
    font-size:12px; letter-spacing:2px; margin-top:-10px; margin-bottom:14px;
    text-shadow:0 0 10px rgba(255,46,136,0.6);
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }

  /* ---------- Touch controls ---------- */
  #touch{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:0 14px 16px; z-index:6;
    pointer-events:none;
  }
  #touch.hidden{ display:none; }
  .tbtn{
    pointer-events:auto;
    width:58px; height:58px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(18,22,31,0.75);
    border:1px solid rgba(0,240,255,0.35);
    color:var(--cyan);
    font-size:22px;
    backdrop-filter:blur(4px);
  }
  .tbtn:active{ background:rgba(0,240,255,0.25); }
  #steer{ display:flex; gap:10px; }
  #boostBtn{
    width:64px; height:64px;
    border-color:rgba(255,46,136,0.5);
    color:var(--magenta);
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:11px; letter-spacing:1px;
  }
  #boostBtn:active{ background:rgba(255,46,136,0.28); }

  @media (min-width:640px){
    #touch{ display:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreVal">0</div>
    </div>
    <div class="hud-block right">
      <div class="hud-label">Speed</div>
      <div class="hud-value" id="speedVal">0<span style="font-size:11px;">km/h</span></div>
    </div>
  </div>
  <div id="boostWrap"><div id="boostBar"></div></div>

  <!-- Start screen -->
  <div class="overlay" id="startScreen">
    <div class="eyebrow">Night Highway · Endless</div>
    <div class="title">MIDNIGHT<br>RUN</div>
    <div class="subtitle">Weave through traffic, grab <b>fuel cells</b> to charge NOS, and outrun the highway as long as you can.</div>
    <button class="btn" id="startBtn">Start Engine</button>
    <div class="hint"><b>◀ ▶</b> or A / D to steer · Hold <b>Space</b> for NOS</div>
  </div>

  <!-- Game over screen -->
  <div class="overlay hidden" id="overScreen">
    <div class="eyebrow" style="color:var(--danger)">Wrecked</div>
    <div class="title" style="font-size:clamp(22px,7vw,30px)">RUN OVER</div>
    <div class="newbest hidden" id="newBest">★ New Best Distance ★</div>
    <div class="stats-row">
      <div class="stat"><div class="n" id="finalScore">0</div><div class="l">Score</div></div>
      <div class="stat"><div class="n" id="finalBest">0</div><div class="l">Best</div></div>
      <div class="stat"><div class="n" id="finalCoins">0</div><div class="l">Fuel Cells</div></div>
    </div>
    <button class="btn" id="restartBtn">Restart</button>
  </div>

  <!-- Touch controls -->
  <div id="touch">
    <div id="steer">
      <div class="tbtn" id="leftBtn">◀</div>
      <div class="tbtn" id="rightBtn">▶</div>
    </div>
    <div class="tbtn" id="boostBtn">NOS</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W, H;

  function resize(){
    const rect = stage.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Game constants ----------
  const ROAD_MARGIN_RATIO = 0.10; // side shoulder ratio of width
  let roadLeft, roadRight, roadWidth;

  function computeRoad(){
    roadLeft = W * ROAD_MARGIN_RATIO;
    roadRight = W * (1 - ROAD_MARGIN_RATIO);
    roadWidth = roadRight - roadLeft;
  }
  computeRoad();

  // ---------- State ----------
  let state = 'start'; // start | playing | over
  let best = 0;

  let bike, obstacles, orbs, particles, skyline;
  let baseSpeed, distance, score, coins, boostMeter, boosting, elapsed, spawnTimer, orbTimer, shake;

  const keys = {left:false, right:false, boost:false};

  function resetGame(){
    computeRoad();
    bike = {
      x: (roadLeft+roadRight)/2,
      y: H * 0.80,
      w: Math.min(W,H) * 0.10,
      h: Math.min(W,H) * 0.16,
      vx: 0,
      lean: 0
    };
    obstacles = [];
    orbs = [];
    particles = [];
    skyline = [];
    for(let i=0;i<7;i++){
      skyline.push({
        x: Math.random()*W,
        w: 18 + Math.random()*36,
        h: 30 + Math.random()*90,
        hue: Math.random() < 0.5 ? 'c' : 'm'
      });
    }
    baseSpeed = H * 0.34;   // px/sec forward speed (visual scroll)
    distance = 0;
    score = 0;
    coins = 0;
    boostMeter = 40;
    boosting = false;
    elapsed = 0;
    spawnTimer = 1.1;
    orbTimer = 1.8;
    shake = 0;
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e)=>{
    if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
    if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
    if(e.key === ' ' || e.key === 'Shift'){ keys.boost = true; e.preventDefault(); }
    if(state !== 'playing' && (e.key === 'Enter' || e.key === ' ')) {
      if(state === 'start') startGame();
      else if(state === 'over') startGame();
    }
  });
  window.addEventListener('keyup', (e)=>{
    if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
    if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
    if(e.key === ' ' || e.key === 'Shift') keys.boost = false;
  });

  function bindHold(el, onDown, onUp){
    el.addEventListener('touchstart', (e)=>{ e.preventDefault(); onDown(); }, {passive:false});
    el.addEventListener('touchend', (e)=>{ e.preventDefault(); onUp(); }, {passive:false});
    el.addEventListener('mousedown', onDown);
    el.addEventListener('mouseup', onUp);
    el.addEventListener('mouseleave', onUp);
  }
  bindHold(document.getElementById('leftBtn'), ()=>keys.left=true, ()=>keys.left=false);
  bindHold(document.getElementById('rightBtn'), ()=>keys.right=true, ()=>keys.right=false);
  bindHold(document.getElementById('boostBtn'), ()=>keys.boost=true, ()=>keys.boost=false);

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  function startGame(){
    resetGame();
    state = 'playing';
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    state = 'over';
    const finalScore = Math.floor(score);
    if(finalScore > best){
      best = finalScore;
      document.getElementById('newBest').classList.remove('hidden');
    } else {
      document.getElementById('newBest').classList.add('hidden');
    }
    document.getElementById('finalScore').textContent = finalScore;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('finalCoins').textContent = coins;
    document.getElementById('overScreen').classList.remove('hidden');
  }

  // ---------- Helpers ----------
  function rand(a,b){ return a + Math.random()*(b-a); }

  function laneX(laneCount, laneIndex, vehicleW){
    const usable = roadWidth - vehicleW;
    const step = usable / (laneCount-1);
    return roadLeft + vehicleW/2 + step*laneIndex;
  }

  const carColors = ['#ff3b3b','#ffb020','#7dffb3','#c58fff','#ff8a3d'];

  function spawnObstacle(){
    const lanes = 3;
    const w = Math.min(W,H) * rand(0.10,0.115);
    const h = w*1.65;
    const lane = Math.floor(rand(0,lanes));
    obstacles.push({
      x: laneX(lanes, lane, w),
      y: -h,
      w, h,
      color: carColors[Math.floor(Math.random()*carColors.length)],
      passed:false
    });
  }

  function spawnOrb(){
    const w = Math.min(W,H)*0.055;
    obstacles_check: {
      const x = rand(roadLeft + w, roadRight - w);
      orbs.push({x, y:-w, r:w, t: Math.random()*10});
    }
  }

  function spawnParticle(x,y,color,life,speed,size){
    particles.push({x,y,color,life,maxLife:life,vy:speed, size});
  }

  // ---------- Update ----------
  let lastTime = 0;
  function loop(now){
    if(state !== 'playing') return;
    let dt = (now - lastTime)/1000;
    dt = Math.min(dt, 0.033);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt){
    elapsed += dt;

    // difficulty ramps with time
    const difficulty = Math.min(elapsed/60, 1); // 0..1 over 60s
    const currentBase = baseSpeed * (1 + difficulty*0.9);

    boosting = keys.boost && boostMeter > 0;
    if(boosting){
      boostMeter = Math.max(0, boostMeter - dt*28);
    } else {
      boostMeter = Math.min(100, boostMeter + dt*6);
    }
    const speedMul = boosting ? 1.9 : 1;
    const speed = currentBase * speedMul;

    // steering
    const accel = 1900;
    const maxVX = 620;
    if(keys.left && !keys.right) bike.vx -= accel*dt;
    else if(keys.right && !keys.left) bike.vx += accel*dt;
    else bike.vx *= Math.max(0, 1 - dt*6.5);
    bike.vx = Math.max(-maxVX, Math.min(maxVX, bike.vx));
    bike.x += bike.vx*dt;

    const halfW = bike.w/2;
    if(bike.x - halfW < roadLeft){ bike.x = roadLeft + halfW; bike.vx = 0; }
    if(bike.x + halfW > roadRight){ bike.x = roadRight - halfW; bike.vx = 0; }

    bike.lean += ((bike.vx/maxVX)*0.5 - bike.lean) * Math.min(1, dt*8);

    // distance / score
    distance += speed*dt;
    score += speed*dt*0.05;

    // spawn obstacles
    spawnTimer -= dt;
    const spawnInterval = Math.max(0.55, 1.25 - difficulty*0.6);
    if(spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = spawnInterval * rand(0.8,1.2);
    }
    orbTimer -= dt;
    if(orbTimer <= 0){
      spawnOrb();
      orbTimer = rand(1.4, 2.4);
    }

    // move obstacles
    for(const o of obstacles){ o.y += speed*dt; }
    obstacles = obstacles.filter(o => o.y < H + o.h);

    for(const orb of orbs){ orb.y += speed*dt; orb.t += dt*6; }
    orbs = orbs.filter(o => o.y < H + o.r);

    // exhaust particles
    if(Math.random() < 0.9){
      spawnParticle(
        bike.x + rand(-bike.w*0.22,bike.w*0.22),
        bike.y + bike.h*0.42,
        boosting ? (Math.random()<0.5?'#ff2e88':'#00f0ff') : 'rgba(200,210,230,0.5)',
        boosting ? 0.35 : 0.28,
        speed*0.55 + rand(20,60),
        boosting ? rand(3,6) : rand(1.5,3)
      );
    }
    for(const p of particles){ p.y += p.vy*dt; p.life -= dt; }
    particles = particles.filter(p=>p.life>0);

    // collisions: bike vs obstacles
    const bx1 = bike.x - bike.w*0.38, bx2 = bike.x + bike.w*0.38;
    const by1 = bike.y - bike.h*0.42, by2 = bike.y + bike.h*0.42;
    for(const o of obstacles){
      const ox1 = o.x - o.w*0.38, ox2 = o.x + o.w*0.38;
      const oy1 = o.y - o.h*0.42, oy2 = o.y + o.h*0.42;
      if(bx1<ox2 && bx2>ox1 && by1<oy2 && by2>oy1){
        crash();
        return;
      }
    }
    // collisions: bike vs orbs
    for(const orb of orbs){
      const dx = orb.x-bike.x, dy = orb.y-bike.y;
      if(Math.hypot(dx,dy) < orb.r + bike.w*0.32){
        orb.dead = true;
        coins++;
        score += 25;
        boostMeter = Math.min(100, boostMeter+18);
        for(let i=0;i<10;i++){
          spawnParticle(orb.x,orb.y, '#ffb020', 0.5, rand(-80,80), rand(2,4));
        }
      }
    }
    orbs = orbs.filter(o=>!o.dead);

    if(shake>0) shake = Math.max(0, shake - dt*3);

    // HUD
    document.getElementById('scoreVal').textContent = Math.floor(score);
    document.getElementById('speedVal').innerHTML = Math.floor(60 + speed*0.16) + '<span style="font-size:11px;">km/h</span>';
    document.getElementById('boostBar').style.width = boostMeter + '%';

    // skyline drift (very slow parallax)
    for(const s of skyline){
      s.x -= dt*10;
      if(s.x < -60) s.x = W+60;
    }
  }

  function crash(){
    state = 'over';
    shake = 1;
    for(let i=0;i<26;i++){
      spawnParticle(bike.x,bike.y, Math.random()<0.5?'#ff3b3b':'#ffb020', rand(0.4,0.9), rand(-160,160), rand(2,5));
    }
    render();
    setTimeout(endGame, 260);
  }

  // ---------- Render ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawBackground(){
    // asphalt gradient
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0d1420');
    g.addColorStop(0.4,'#0b0e14');
    g.addColorStop(1,'#0a0c11');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // skyline silhouettes
    for(const s of skyline){
      ctx.fillStyle = s.hue==='c' ? 'rgba(0,240,255,0.06)' : 'rgba(255,46,136,0.06)';
      ctx.fillRect(s.x, H*0.10 - s.h, s.w, s.h);
      ctx.fillStyle = s.hue==='c' ? 'rgba(0,240,255,0.35)' : 'rgba(255,46,136,0.35)';
      ctx.fillRect(s.x, H*0.10 - s.h, s.w, 2);
    }

    // shoulders
    ctx.fillStyle = '#070911';
    ctx.fillRect(0,0,roadLeft,H);
    ctx.fillRect(roadRight,0,W-roadRight,H);

    // road
    ctx.fillStyle = '#12161f';
    ctx.fillRect(roadLeft,0,roadWidth,H);

    // edge glow lines
    ctx.strokeStyle = 'rgba(0,240,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(roadLeft,0); ctx.lineTo(roadLeft,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(roadRight,0); ctx.lineTo(roadRight,H); ctx.stroke();

    // lane dashes (scroll with distance)
    const laneXs = [roadLeft + roadWidth/3, roadLeft + roadWidth*2/3];
    const dashLen = H*0.06, gapLen = H*0.05;
    const cycle = dashLen+gapLen;
    const offset = (distance*0.9) % cycle;
    ctx.strokeStyle = 'rgba(244,211,94,0.55)';
    ctx.lineWidth = Math.max(2, W*0.008);
    for(const lx of laneXs){
      let y = -cycle + offset;
      while(y < H){
        ctx.beginPath();
        ctx.moveTo(lx,y);
        ctx.lineTo(lx,y+dashLen);
        ctx.stroke();
        y += cycle;
      }
    }
  }

  function drawVehicle(x,y,w,h,color,lean, lit){
    ctx.save();
    ctx.translate(x,y);
    if(lean) ctx.rotate(lean*0.35);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0,h*0.42,w*0.42,h*0.14,0,0,Math.PI*2);
    ctx.fill();

    if(lit){
      // headlight beam
      const beam = ctx.createLinearGradient(0,-h*0.5,0,-h*2.4);
      beam.addColorStop(0,'rgba(255,255,255,0.30)');
      beam.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(-w*0.28,-h*0.5);
      ctx.lineTo(w*0.28,-h*0.5);
      ctx.lineTo(w*0.9,-h*2.4);
      ctx.lineTo(-w*0.9,-h*2.4);
      ctx.closePath();
      ctx.fill();
    }

    // body
    ctx.fillStyle = color;
    roundRect(-w*0.32,-h*0.5,w*0.64,h, w*0.22);
    ctx.fill();

    // windshield / stripe
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    roundRect(-w*0.18,-h*0.30,w*0.36,h*0.22, w*0.1);
    ctx.fill();

    // wheels
    ctx.fillStyle = '#05060a';
    roundRect(-w*0.42,-h*0.42,w*0.16,h*0.24,3); ctx.fill();
    roundRect(w*0.26,-h*0.42,w*0.16,h*0.24,3); ctx.fill();
    roundRect(-w*0.42,h*0.18,w*0.16,h*0.24,3); ctx.fill();
    roundRect(w*0.26,h*0.18,w*0.16,h*0.24,3); ctx.fill();

    if(lit){
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.ellipse(-w*0.16,-h*0.48,w*0.06,h*0.03,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w*0.16,-h*0.48,w*0.06,h*0.03,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ff3b3b';
      ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.ellipse(-w*0.16,h*0.47,w*0.05,h*0.025,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w*0.16,h*0.47,w*0.05,h*0.025,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function drawBike(){
    ctx.save();
    let ox = 0, oy = 0;
    if(shake>0){ ox = rand(-6,6)*shake; oy = rand(-6,6)*shake; }
    ctx.translate(bike.x+ox, bike.y+oy);
    ctx.rotate(bike.lean*0.3);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0,bike.h*0.46,bike.w*0.5,bike.h*0.14,0,0,Math.PI*2);
    ctx.fill();

    // headlight beam ahead
    const boostLen = boosting ? 3.2 : 2.1;
    const beam = ctx.createLinearGradient(0,-bike.h*0.5,0,-bike.h*boostLen*1.6);
    beam.addColorStop(0, boosting? 'rgba(0,240,255,0.55)':'rgba(255,255,255,0.35)');
    beam.addColorStop(1,'rgba(0,240,255,0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-bike.w*0.22,-bike.h*0.5);
    ctx.lineTo(bike.w*0.22,-bike.h*0.5);
    ctx.lineTo(bike.w*1.1,-bike.h*boostLen*1.6);
    ctx.lineTo(-bike.w*1.1,-bike.h*boostLen*1.6);
    ctx.closePath();
    ctx.fill();

    // rear wheel
    ctx.fillStyle = '#05060a';
    roundRect(-bike.w*0.14,bike.h*0.28,bike.w*0.28,bike.h*0.22,4); ctx.fill();
    // front wheel
    roundRect(-bike.w*0.14,-bike.h*0.50,bike.w*0.28,bike.h*0.22,4); ctx.fill();

    // body
    const bodyGrad = ctx.createLinearGradient(0,-bike.h*0.4,0,bike.h*0.4);
    bodyGrad.addColorStop(0, boosting ? '#ff2e88' : '#00d9e8');
    bodyGrad.addColorStop(1, '#0a2b33');
    ctx.fillStyle = bodyGrad;
    roundRect(-bike.w*0.20,-bike.h*0.34,bike.w*0.40,bike.h*0.62, bike.w*0.16);
    ctx.fill();

    // rider
    ctx.fillStyle = '#1a1f2b';
    ctx.beginPath();
    ctx.ellipse(0,-bike.h*0.05,bike.w*0.16,bike.h*0.16,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = boosting ? '#ff8fc0' : '#00f0ff';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0,-bike.h*0.22,bike.w*0.10,bike.h*0.08,0,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // headlamp glow dot
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0,-bike.h*0.50,bike.w*0.10,bike.h*0.035,0,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawOrb(o){
    ctx.save();
    ctx.translate(o.x,o.y + Math.sin(o.t)*3);
    ctx.fillStyle = 'rgba(255,176,32,0.25)';
    ctx.beginPath(); ctx.arc(0,0,o.r*1.8,0,Math.PI*2); ctx.fill();
    const g = ctx.createRadialGradient(0,0,0,0,0,o.r);
    g.addColorStop(0,'#fff4d6');
    g.addColorStop(0.5,'#ffb020');
    g.addColorStop(1,'#c9770a');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ffb020'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0,0,o.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10,10,15,0.65)';
    ctx.font = `${o.r*1.1}px Orbitron, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚡', 0, 1);
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a = Math.max(0, p.life/p.maxLife);
      ctx.globalAlpha = a*0.8;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*a+0.5,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render(){
    ctx.save();
    if(shake>0){
      ctx.translate(rand(-8,8)*shake, rand(-8,8)*shake);
    }
    drawBackground();
    for(const o of obstacles) drawVehicle(o.x,o.y,o.w,o.h,o.color,0,false);
    for(const orb of orbs) drawOrb(orb);
    drawParticles();
    if(state==='playing' || shake>0) drawBike();

    // vignette
    const vg = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
  }

  // idle preview render on start screen
  computeRoad();
  resetGame();
  render();

  // keep canvas responsive: re-render idle frame on resize while not playing
  window.addEventListener('resize', ()=>{
    if(state !== 'playing'){
      computeRoad();
      bike.x = (roadLeft+roadRight)/2;
      bike.y = H*0.80;
      render();
    }
  });
})();
</script>
</body>
